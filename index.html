<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>ラケットスポーツ：テニス＆バドミントン</title>
<style>
:root{--bg:#0f1720;--fg:#f2f6fa;--ac:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
[hidden]{display:none!important}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,18,.72)}
.card{background:#18222e;border:1px solid #2c3b4c;border-radius:16px;padding:24px 28px;text-align:center;max-width:340px}
.card h1{margin:0 0 6px;font-size:24px}.card p{margin:0 0 14px;opacity:.8}
button{display:block;width:100%;margin:8px 0;padding:12px;font-size:17px;border:0;border-radius:10px;background:var(--ac);color:#111;font-weight:700;cursor:pointer}
details{margin:12px 0;text-align:left}label{display:flex;justify-content:space-between;gap:10px;margin:8px 0}
#hud{position:fixed;inset:0;pointer-events:none;text-align:center}
#score{margin-top:calc(env(safe-area-inset-top,0px) + 10px);display:inline-block;background:rgba(8,12,18,.7);padding:8px 18px;border-radius:12px;font-size:20px;font-weight:700}
#msg{position:fixed;top:38%;left:0;right:0;font-size:34px;font-weight:800;text-shadow:0 2px 8px #000}
#help{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:0;right:0;font-size:12px;opacity:.8}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.45)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;background:rgba(255,210,63,.85);margin:0;padding:0}
#bs{right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:96px;height:96px;font-size:18px}
#bp,#bd{width:64px;height:64px;font-size:13px;background:rgba(255,255,255,.6)}
#bp{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
#bd{right:calc(env(safe-area-inset-right,0px) + 34px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:auto;margin:0;padding:8px 12px;font-size:14px}
#menu{background:radial-gradient(ellipse at 30% 40%,rgba(10,20,50,.35),rgba(5,8,18,.85))}
.home{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:4vmin;width:min(920px,92vw)}
.logo small{letter-spacing:.4em;color:var(--ac);font-weight:700}
.logo h1{margin:4px 0;font-size:clamp(44px,13vmin,110px);line-height:.92;font-style:italic;font-weight:900;background:linear-gradient(180deg,#fff,#ffd23f 60%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.logo p{margin:0;opacity:.85;letter-spacing:.2em}
.modes{display:flex;flex-direction:column;gap:2.4vmin}
button.mode{display:flex;align-items:center;gap:16px;margin:0;padding:2vmin 3vmin;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.35);color:var(--fg);backdrop-filter:blur(6px);transform:skewX(-6deg);transition:transform .15s,background .15s}
button.mode:hover,button.mode:active{transform:skewX(-6deg) scale(1.04);background:linear-gradient(135deg,#ffd23f,#ff9a00);color:#111}
button.mode span{font-size:clamp(30px,9vmin,64px)}button.mode b{font-size:clamp(20px,5.5vmin,34px);flex:1;text-align:left}button.mode em{font-style:normal;font-size:clamp(12px,3vmin,16px);font-weight:800;opacity:.9}
.set{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:200px;background:rgba(8,12,18,.7);padding:8px 12px;border-radius:12px;margin:0}
.hint{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);opacity:.6;font-size:11px}
#fs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:auto;margin:0;padding:8px 12px;font-size:14px;background:rgba(255,255,255,.15);color:var(--fg)}
#rot{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b111a;font-size:18px;text-align:center}
#rot i{font-size:60px;font-style:normal;display:block;animation:rt 1.6s infinite}@keyframes rt{50%{transform:rotate(90deg)}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
@media (max-width:640px) and (orientation:portrait){.home{grid-template-columns:1fr}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
#score{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);margin:0;padding:0;overflow:hidden;font-size:15px;text-align:left;border-radius:8px;border-left:5px solid var(--ac);background:rgba(8,12,18,.85);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sr{display:grid;grid-template-columns:54px 28px 44px;align-items:center;padding:5px 10px;font-weight:800;letter-spacing:.05em}.sr:first-child{border-bottom:1px solid rgba(255,255,255,.12)}.sr i{font-style:normal;text-align:center;opacity:.8}.sr u{text-decoration:none;text-align:center;background:var(--ac);color:#111;border-radius:4px;padding:1px 0}
#msg{letter-spacing:.06em;font-style:italic;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.4)}
#msg:not(:empty){animation:pop .35s ease-out}@keyframes pop{from{transform:scale(1.6);opacity:0}}
#spd{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 82px);font:800 18px system-ui;color:var(--ac);text-shadow:0 2px 6px #000}
#menu{background:linear-gradient(180deg,rgba(70,160,255,.55),rgba(255,255,255,.2) 60%,rgba(255,200,80,.35))}

#av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #fff;box-shadow:0 0 0 2px rgba(22,50,79,.15)}
#nm{width:6.5em;border:0;background:transparent;font:800 15px system-ui,sans-serif;color:#16324f;outline:0;user-select:text;-webkit-user-select:text}
#rec{font-size:12px;font-weight:700;opacity:.8}
.logo h1{background:linear-gradient(180deg,#fff,#bfe6ff 55%,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(20,60,120,.55);filter:drop-shadow(0 5px 0 rgba(20,60,120,.35))}
.logo small,.logo p{color:#fff;text-shadow:0 2px 0 rgba(20,60,120,.5)}
button.mode{background:#fff;color:#16324f;border:0;border-radius:28px;transform:none;box-shadow:0 8px 0 rgba(20,60,120,.3);backdrop-filter:none}
button.mode span{width:1.4em;height:1.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vmin,56px)}
button.mode[data-m=tennis] span{background:#c6f36b}button.mode[data-m=badminton] span{background:#9fe3ff}
button.mode:hover,button.mode:active{transform:translateY(-4px) scale(1.03);background:#fff;color:#16324f;box-shadow:0 12px 0 rgba(20,60,120,.3)}
button.mode em{background:#ff5a3c;color:#fff;border-radius:20px;padding:4px 12px}
#opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;background:rgba(255,255,255,.9);color:#16324f;border-radius:20px;padding:8px 14px;box-shadow:0 6px 0 rgba(20,60,120,.25)}
.og{display:flex;align-items:center;gap:6px}.og label{font-weight:800;font-size:12px;opacity:.7;margin:0;display:block}
.seg{display:flex;background:#e6eef7;border-radius:20px;padding:3px}
.seg button{width:auto;margin:0;padding:6px 12px;font-size:13px;border-radius:16px;background:transparent;color:#16324f}.seg button.on{background:#ff5a3c;color:#fff}
#cols{display:flex;gap:6px}.sw{width:24px;height:24px;padding:0;margin:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(22,50,79,.25)}.sw.on{box-shadow:0 0 0 3px #ff5a3c}
.set{background:rgba(255,255,255,.92);color:#16324f}
#fs{background:rgba(255,255,255,.92);color:#16324f;font-weight:800;border-radius:20px}
.hint{color:#fff;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rc{background:#fff;color:#16324f;border-radius:28px;padding:22px 40px;text-align:center;box-shadow:0 10px 0 rgba(20,60,120,.3);min-width:260px}
.rc h2{margin:0;font-size:64px;font-style:italic;font-weight:900}.rc h2.win{color:#ff5a3c}.rc h2.lose{color:#4a6fa5}.rc p{margin:6px 0 14px;font-weight:800}
.rc button{background:#ff5a3c;color:#fff;border-radius:20px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.sr{grid-template-columns:minmax(54px,auto) 28px 44px;gap:6px}
</style></head><body>
<div id="hud" hidden><div id="score"></div><div id="msg"></div><div id="spd"></div><div id="help">移動 WASD/矢印 ・ ダッシュ Shift ・ スイング/サーブ Space ・ 前＋Space ドロップ ・ Shift＋Space 強打 ・ Esc メニュー</div></div>
<div id="res" class="ov" hidden><div class="rc"><h2 id="rt"></h2><p id="rs"></p><button id="ra">もう一度</button><button id="rm">メニューへ</button></div></div>
<div id="rot"><i>📱</i>横向きにしてください</div>
<div id="touch" hidden><div id="joy"><div id="knob"></div></div><button class="tb" id="bs">スイング</button><button class="tb" id="bp">強打</button><button class="tb" id="bd">ドロップ</button></div>
<button id="mb" hidden>☰</button>
<div id="menu" class="ov"><div id="topbar"><div id="av">🙂</div><input id="nm" maxlength="6" aria-label="name"><span id="rec"></span></div><div class="home"><div class="logo"><small>RACKET SPORTS</small><h1 id="ttl">RACKET<br>STARS</h1><p>テニス ＆ バドミントン</p></div><div class="modes">
<button class="mode" data-m="tennis"><span>🎾</span><b>テニス</b><em>PLAY ▶</em></button><button class="mode" data-m="badminton"><span>🏸</span><b>バドミントン</b><em>PLAY ▶</em></button></div>
<div id="opts"><div class="og"><label>モード</label><div class="seg" data-k="mode"><button data-v="0">対戦</button><button data-v="1">ラリー練習</button></div></div><div class="og"><label>つよさ</label><div class="seg" data-k="diff"><button data-v="0">やさしい</button><button data-v="1">ふつう</button><button data-v="2">つよい</button></div></div><div class="og"><label>試合</label><div class="seg" data-k="mlen"><button data-v="0">短い</button><button data-v="1">標準</button></div></div><div class="og"><label>カラー</label><div id="cols"></div></div></div>
<details class="set"><summary>⚙ 設定</summary><label>音量<input id="vol" type="range" min="0" max="1" step=".05" value=".5"></label><label>画質<select id="q"><option value="2">高</option><option value="1.5">中</option><option value="1">低</option></select></label></details>
<small class="hint">PC：キーボード ／ スマホ：横向きで操作</small><button id="fs">⛶ 全画面</button></div></div>
