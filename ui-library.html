/* Nintendo Switch Sports-inspired match introduction (original assets and UI) */
#matchIntro{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;background:linear-gradient(135deg,rgba(16,38,72,.20),rgba(5,15,32,.58) 55%,rgba(14,41,74,.22));transition:opacity .45s ease}

/* Instant replay controls */

/* Power-shot impact effect */
#powerImpact{position:fixed;inset:0;z-index:55;pointer-events:none;display:grid;place-items:center;overflow:hidden;opacity:0}
#powerImpact.fire{animation:powerFlash .62s ease-out both}
#powerImpact .pi-ring{position:absolute;width:min(42vw,42vh);aspect-ratio:1;border:clamp(3px,.65vw,8px) solid #fff;border-radius:50%;box-shadow:0 0 12px #fff,0 0 35px #31d9ff,inset 0 0 28px #31d9ff;transform:scale(.1);opacity:0}

#powerImpact .pi-burst{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg 8deg,rgba(95,224,255,.8) 8.5deg 9.5deg,rgba(255,255,255,0) 10deg 18deg);mask-image:radial-gradient(circle,transparent 0 9%,#000 22% 50%,transparent 72%);opacity:0;transform:scale(.25) rotate(-12deg)}
#powerImpact.fire .pi-burst{animation:powerBurst .55s ease-out both}
#powerImpact .pi-label{position:relative;z-index:1;color:#fff;font-weight:1000;font-size:clamp(25px,7vw,72px);font-style:italic;letter-spacing:.06em;text-align:center;text-shadow:0 3px 0 #0877b8,0 6px 0 #00456f,0 0 24px #31d9ff;opacity:0;transform:scale(.5) rotate(-5deg)}

@keyframes powerFlash{0%{opacity:0;background:rgba(190,248,255,0)}12%{opacity:1;background:rgba(190,248,255,.58)}38%{opacity:.8;background:rgba(20,150,255,.12)}100%{opacity:0;background:transparent}}
@keyframes powerRing{0%{opacity:0;transform:scale(.1)}22%{opacity:1}100%{opacity:0;transform:scale(3.2)}}
@keyframes powerBurst{0%{opacity:0;transform:scale(.25) rotate(-12deg)}25%{opacity:.9}100%{opacity:0;transform:scale(1.4) rotate(18deg)}}
@keyframes powerLabel{0%{opacity:0;transform:scale(.5) rotate(-5deg)}25%{opacity:1;transform:scale(1.12) rotate(2deg)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08) translateY(-16px)}}

/* アプリらしい操作感：既存の色・形・レイアウトを維持して反応だけを統一 */

/* RACKET STARS 起動画面：明るく爽やかなスポーツゲーム演出 */
#appSplash{position:fixed;inset:0;z-index:250000;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;padding:24px;box-sizing:border-box;background:#f5ffff!important;background-image:radial-gradient(ellipse at 50% 44%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.8) 24%,transparent 57%),linear-gradient(135deg,#d9fbf4 0%,#f9ffff 43%,#e3f1ff 100%)!important;color:#fff;text-align:center;opacity:1;transition:opacity .48s ease,visibility .48s ease}
#appSplash[hidden]{display:none!important}
#appSplash.leaving{opacity:0;visibility:hidden;pointer-events:none}
.splashGlow{position:absolute;z-index:0;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 16% 22%,rgba(78,224,207,.25),transparent 30%),radial-gradient(ellipse at 84% 27%,rgba(97,180,255,.22),transparent 32%),radial-gradient(ellipse at 52% 92%,rgba(59,196,219,.2),transparent 36%);filter:none;animation:none}
.splashOrb{position:absolute;z-index:1;width:clamp(120px,24vw,300px);aspect-ratio:1;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.36),rgba(112,226,220,.08));box-shadow:inset 0 0 12px rgba(255,255,255,.35);pointer-events:none}
.splashOrb.one{top:-9%;left:-5%;animation:none}
.splashOrb.two{right:-8%;bottom:1%;width:clamp(160px,30vw,390px);animation:none}
.splashOrb.three{right:16%;top:12%;width:clamp(36px,6vw,76px);background:rgba(255,255,255,.28);box-shadow:0 0 30px rgba(255,255,255,.7);animation:none}
#appSplash:before{content:'';position:absolute;z-index:1;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 20%,rgba(57,200,198,.32) 0 1px,transparent 2px),radial-gradient(circle at 84% 17%,rgba(63,160,225,.3) 0 2px,transparent 3px),radial-gradient(circle at 18% 76%,rgba(57,200,198,.25) 0 2px,transparent 3px),radial-gradient(circle at 91% 70%,rgba(63,160,225,.24) 0 1px,transparent 2px),radial-gradient(circle at 72% 84%,rgba(255,255,255,.9) 0 2px,transparent 4px),radial-gradient(ellipse at 50% 100%,rgba(57,180,220,.13),transparent 48%)}
#appSplash:after{display:none;content:''}
.splashCourt{position:absolute;z-index:2;left:50%;bottom:-43%;width:min(155vw,1850px);height:100%;transform:translateX(-50%) perspective(740px) rotateX(62deg);transform-origin:center bottom;border:2px solid rgba(43,174,201,.25);border-radius:5px;background:linear-gradient(180deg,rgba(75,220,206,.15),rgba(76,166,231,.13));box-shadow:inset 0 0 0 2px rgba(255,255,255,.84);pointer-events:none}
.splashCourt:before,.splashCourt:after{content:'';position:absolute;pointer-events:none}
.splashCourt:before{left:0;right:0;top:50%;border-top:2px solid rgba(43,174,201,.22);box-shadow:0 24px 0 rgba(255,255,255,.5)}
.splashCourt:after{top:0;bottom:0;left:50%;border-left:2px solid rgba(43,174,201,.19)}
.splashContent{position:relative;z-index:3;width:min(740px,100%);padding:0 12px 12px;box-sizing:border-box;animation:none}
.splashMark{position:relative;display:flex;align-items:center;justify-content:center;width:82px;height:82px;margin:0 auto 22px;border:3px solid rgba(255,255,255,.98);border-radius:27px;background:linear-gradient(145deg,#51dfd0 0%,#39bfdf 53%,#4b91ed 100%);box-shadow:0 8px 18px rgba(55,164,211,.14),inset 0 2px 0 rgba(255,255,255,.68);font-size:27px;font-weight:1000;letter-spacing:-.08em;color:#fff;text-shadow:0 2px 7px rgba(28,117,171,.22);animation:none}
.splashMark:after{content:'';position:absolute;inset:6px;border:1px solid rgba(255,255,255,.46);border-radius:20px;pointer-events:none}
.splashEyebrow{margin:0 0 11px;color:#50b8c7;font-size:10px;font-weight:950;letter-spacing:.62em;text-indent:.62em}
#appSplash h1{margin:0;font-size:clamp(56px,13.5vmin,104px);font-weight:1000;font-style:italic;line-height:.84;letter-spacing:-.085em;color:#fff;-webkit-text-stroke:2px #42b8d1;text-shadow:0 4px 0 rgba(52,177,207,.17),0 8px 0 rgba(51,155,205,.08);filter:none}
.splashSub{margin:22px 0 0;color:#51b5c7;font-size:11px;font-weight:900;letter-spacing:.32em}

@keyframes splashEnter{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes splashMarkIn{from{opacity:0;transform:scale(.65) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes splashSweep{0%,20%{transform:translateX(-75%);opacity:0}38%{opacity:.9}72%,100%{transform:translateX(75%);opacity:0}}
