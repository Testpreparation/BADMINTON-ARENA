<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071426"><title>SPORTS ARENA</title>
<style>
:root{--cyan:#70e8ff;--glass:rgba(8,22,42,.82);--border:rgba(255,255,255,.2)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081321;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#061326c9,#07192d50)}.card{width:min(700px,96vw);max-height:94vh;overflow:auto;padding:clamp(18px,4vw,32px);border:1px solid var(--border);border-radius:24px;background:linear-gradient(145deg,#102b49ed,#091629ed);box-shadow:0 24px 70px #0007;backdrop-filter:blur(15px)}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--cyan);font-weight:850}.title{font-size:clamp(28px,6vw,48px);line-height:1.1;margin:9px 0 14px}.desc{color:#c8d9e9;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.choice{min-height:116px;border:1px solid #ffffff2d;border-radius:17px;padding:16px;text-align:left;color:white;background:linear-gradient(140deg,#1b4569,#11223c);cursor:pointer}.choice:hover{border-color:var(--cyan)}.choice span{display:block;font-size:28px}.choice b{display:block;font-size:18px;margin:7px 0 3px}.choice small{color:#c1d5e7}.btn{border:1px solid #ffffff36;border-radius:12px;background:#203e5f;color:white;padding:11px 16px;font-weight:750;cursor:pointer}.btn.primary{background:linear-gradient(120deg,#0c9fbe,#2e70d8);border-color:#8ceeff}#hud{display:none;position:absolute;top:12px;left:12px;right:12px;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.hudbox{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:9px 13px;backdrop-filter:blur(10px)}#score{font-size:clamp(22px,4vw,32px);font-weight:900;text-align:center}#score small{display:block;font-size:10px;color:#bdd5e9;letter-spacing:.16em}#status{font-size:11px;text-align:center;color:#bdd5e9}#tip{font-size:12px;line-height:1.5;max-width:235px}#controls{position:absolute;bottom:12px;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}.cluster{display:flex;gap:7px;align-items:flex-end;pointer-events:auto}.ctl{width:clamp(48px,11vw,68px);height:clamp(48px,11vw,68px);border:1px solid #ffffff70;border-radius:50%;color:#fff;background:#091d36d9;font-weight:850;font-size:13px;touch-action:none}.ctl.action{background:linear-gradient(135deg,#0babc8,#2568d2)}.ctl.square{border-radius:16px;width:72px}#toast{display:none;position:absolute;top:22%;left:50%;transform:translateX(-50%);padding:11px 17px;background:#061629e8;border:1px solid #ffffff35;border-radius:12px;text-align:center;white-space:pre-line;max-width:90vw}@media(orientation:portrait){.card{max-height:86vh}.choice{padding:12px;min-height:108px}.choice b{font-size:16px}#tip{max-width:130px;font-size:10px}}
</style></head><body><div id="stage"></div>
<div id="menu" class="overlay"><div class="card"><div class="eyebrow">SPORTS ARENA / MATCH SETUP</div><h1 class="title" id="title">体育館スポーツ<br><span style="color:var(--cyan)">ARENA</span></h1><p class="desc" id="desc">競技と試合形式を選んでください。</p><div class="grid" id="choices"></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="back">← メインメニュー</button></div></div></div>
<div id="hud"><div class="hudbox"><div id="score"><small>HOME — AWAY</small>0 : 0</div><div id="status">READY</div></div><div class="hudbox" id="tip">WASD / 矢印：移動<br>Space / HIT：返球</div><button class="btn" id="pause" style="pointer-events:auto">Ⅱ</button></div>
<div id="controls"><div class="cluster"><button class="ctl" data-move="left">◀</button><div style="display:flex;flex-direction:column;gap:4px"><button class="ctl" data-move="up">▲</button><button class="ctl" data-move="down">▼</button></div><button class="ctl" data-move="right">▶</button></div><div class="cluster"><button class="ctl" id="serve">SERVE</button><button class="ctl action" id="hit">HIT</button></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search);let sport=qs.get('sport')==='tabletennis'?'tabletennis':'volleyball',format='singles',serveType='通常サーブ',scene,camera,renderer,clock,ball,vel=new THREE.Vector3(),court=[],people=[],keys=new Set(),touch=new Set(),score=[0,0],state='menu',paused=false,pointLock=0;
const v=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),mat=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r}),M={floor:mat(0x9aa7b5),line:mat(0xf4f7fb),blue:mat(0x267fc0),red:mat(0xd84c58),skin:mat(0xe2b38e),shorts:mat(0x172a41),net:mat(0xdce7ef)};
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0xa9c1d2);scene.fog=new THREE.Fog(0xa9c1d2,32,85);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;$('stage').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaf6ff,0x586779,1.9));let sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-8,15,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);clock=new THREE.Clock();addEventListener('resize',resize);drawMenu();frame()}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function addBox(w,h,d,m,x,y,z,rot=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.y=rot;o.castShadow=true;o.receiveShadow=true;scene.add(o);court.push(o);return o}
function line(x1,z1,x2,z2,y=.08){let dx=x2-x1,dz=z2-z1;addBox(Math.hypot(dx,dz),.025,.045,M.line,(x1+x2)/2,y,(z1+z2)/2,-Math.atan2(dz,dx))}
function person(x,z,team,user=false,idx=0){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);people.push(g);let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.26,.62,4,8),team===0?M.blue:M.red);torso.position.y=1.04;torso.castShadow=true;g.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.21,12,10),M.skin);head.position.y=1.68;g.add(head);let shorts=new THREE.Mesh(new THREE.BoxGeometry(.43,.28,.32),M.shorts);shorts.position.y=.52;g.add(shorts);for(let side of [-1,1]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.08,.37,3,6),M.shorts);leg.position.set(side*.13,.23,0);g.add(leg)}g.userData={team,user,idx,home:v(x,0,z)};return g}
function clear(){for(const o of [...court,...people])scene.remove(o);court=[];people=[];if(ball)scene.remove(ball);ball=null}
function build(){clear();const volley=sport==='volleyball',w=volley?18:13,d=volley?9:7;addBox(46,.5,32,M.floor,0,-.3,0);let wall=mat(0xd8e2e9);addBox(46,10,.4,wall,0,4.7,-15.8);addBox(.4,10,32,wall,-22.8,4.7,0);addBox(.4,10,32,wall,22.8,4.7,0);for(let x=-18;x<=18;x+=6){addBox(.18,8,.18,mat(0x7c8e9d),x,4,-15.4);addBox(.15,.15,30,mat(0x9babb8),x,8.7,0)}for(let x of [-14,-5,5,14])addBox(2.6,.1,.45,new THREE.MeshBasicMaterial({color:0xffffff}),x,8.45,-12);
addBox(w,.07,d,mat(volley?0x267b9c:0x704431),0,.02,0);line(-w/2,-d/2,w/2,-d/2);line(-w/2,d/2,w/2,d/2);line(-w/2,-d/2,-w/2,d/2);line(w/2,-d/2,w/2,d/2);
if(volley){line(-w/2,-3,w/2,-3);line(-w/2,3,w/2,3);addBox(.1,2.5,.1,mat(0xeeeeee),0,1.25,0);addBox(w,.06,.1,M.net,0,2.45,0);for(let x=-w/2;x<=w/2;x+=.3)addBox(.018,1.3,.018,mat(0xb9c7d1),x,1.75,0);for(let y=1.2;y<=2.4;y+=.2)addBox(w,.018,.018,mat(0xb9c7d1),0,y,0);for(let t=0;t<2;t++)for(let i=0;i<3;i++)person((i-1)*4.1,t? -5.2:5.2,t,t===0&&i===1,i)}
else{addBox(4.3,.16,2.45,mat(0x126c9a),0,.82,0);addBox(4.35,.05,.08,M.net,0,.96,0);addBox(.06,.18,2.48,M.net,0,1.03,0);for(let x of [-1.8,1.8])for(let z of [-.9,.9])addBox(.09,.78,.09,mat(0x26333e),x,.4,z);let dbl=format==='doubles';person(dbl?-.8:0,4,0,true,0);if(dbl)person(.8,4,0,true,1);person(dbl?-.8:0,-4,1,false,0);if(dbl)person(.8,-4,1,false,1)}
ball=new THREE.Mesh(new THREE.SphereGeometry(volley?.27:.12,18,14),mat(volley?0xf4e7a0:0xfaf8e8,.3));ball.castShadow=true;scene.add(ball);camera.position.set(0,volley?11:8,volley?16:12);camera.lookAt(0,0,0);resetServe()}
function drawMenu(){const choices=$('choices');choices.innerHTML='';if(sport==='volleyball'){$('title').textContent='🏐 バレーボール';$('desc').textContent='3対3。サーブの種類を選んで試合を開始。';['通常サーブ','ジャンプサーブ','フローターサーブ','ジャンプフローター'].forEach((t,i)=>choice(['🎯','🚀','〰️','⚡'][i],t,['安定したサーブ','高い打点から強打','揺れる軌道','ジャンプ＋揺れる軌道'][i],()=>{serveType=t;start()}))}
else{$('title').textContent='🏓 卓球';$('desc').textContent='試合形式を選んで試合を開始。';[['singles','👤','シングルス','1対1'],['doubles','👥','ダブルス','2対2']].forEach(([f,e,t,d])=>choice(e,t,d,()=>{format=f;start()}))}}
function choice(e,t,d,fn){let b=document.createElement('button');b.className='choice';b.innerHTML='<span>'+e+'</span><b>'+t+'</b><small>'+d+'</small>';b.onclick=fn;$('choices').appendChild(b)}
function start(){state='ready';paused=false;score=[0,0];$('menu').style.display='none';$('hud').style.display='flex';$('controls').style.display='flex';$('tip').innerHTML=sport==='volleyball'?'WASD / 矢印：移動<br>SERVE：サーブ・HIT：返球':'A/D・←/→：移動<br>SERVE：サーブ・HIT：返球';build();if(innerWidth>innerHeight&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
function toast(s,ms=1200){let e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',ms)}
function hud(){ $('score').innerHTML='<small>HOME — AWAY</small>'+score[0]+' : '+score[1];$('status').textContent=(sport==='volleyball'?'VOLLEYBALL 3 VS 3':'TABLE TENNIS '+format.toUpperCase())+' · '+state.toUpperCase()}
function resetServe(){state='ready';vel.set(0,0,0);ball.position.set(0,sport==='volleyball'?1.9:1.35,sport==='volleyball'?4.6:3.4);hud();toast(sport==='volleyball'?serveType+'を選択してSERVE':'SERVEで試合開始')}
function serveBall(){if(state!=='ready'||paused)return;state='rally';ball.position.set(0,sport==='volleyball'?2.2:1.45,sport==='volleyball'?4.3:3.3);let p=sport==='volleyball'?({'通常サーブ':7,'ジャンプサーブ':10,'フローターサーブ':7.7,'ジャンプフローター':9}[serveType]||7):6.4;vel.set((Math.random()-.5)*.8,sport==='volleyball'?(serveType.includes('ジャンプ')?4.4:2.2):2.1,-p);hud();toast(sport==='volleyball'?serveType+'！':'サーブ！')}
function hit(){if(state!=='rally'||paused)return;let p=people.find(o=>o.userData.user);if(!p)return;if(p.position.distanceTo(ball.position)<(sport==='volleyball'?3.3:3.8)){vel.set((Math.random()-.5)*(sport==='volleyball'?5:2.5),sport==='volleyball'?5.5:2.4,-(sport==='volleyball'?7.8:6.8));toast(sport==='volleyball'?'レシーブ！':'返球！',500)}}
function move(dt){let p=people.find(o=>o.userData.user);if(!p)return;let x=0,z=0;if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A')||touch.has('left'))x--;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D')||touch.has('right'))x++;if(keys.has('ArrowUp')||keys.has('w')||keys.has('W')||touch.has('up'))z--;if(keys.has('ArrowDown')||keys.has('s')||keys.has('S')||touch.has('down'))z++;let lim=sport==='volleyball'?7.7:2.4;p.position.x=THREE.MathUtils.clamp(p.position.x+x*(sport==='volleyball'?5.5:4.5)*dt,-lim,lim);p.position.z=THREE.MathUtils.clamp(p.position.z+z*5*dt,sport==='volleyball'?1.2:2.1,sport==='volleyball'?7.7:5.2);if(x||z)p.rotation.y=Math.atan2(x,z)}
function award(w){if(pointLock>0)return;pointLock=1.15;score[w]++;ball.position.set(0,1,4);vel.set(0,0,0);state='point';hud();toast((w===0?'あなたのポイント！':'相手のポイント')+'\n'+score[0]+' : '+score[1],1000);if(score[w]>=(sport==='volleyball'?15:11)&&Math.abs(score[0]-score[1])>=2){toast((w===0?'YOU WIN!':'MATCH OVER')+'\n次のサーブで再開',1800);score=[0,0]}setTimeout(()=>{if(state==='point')resetServe()},1100)}
function frame(){requestAnimationFrame(frame);if(!renderer)return;let dt=Math.min(clock.getDelta(),.035);if(!paused&&state==='rally'&&ball){move(dt);let volley=sport==='volleyball';vel.y-=(volley?9.8:8.8)*dt;ball.position.addScaledVector(vel,dt);
if(Math.abs(ball.position.x)>(volley?9:6.5)){award(ball.position.x<0?1:0)}
if(volley){if(Math.abs(ball.position.z)<.12&&ball.position.y<2.45&&ball.position.y>.4){vel.z*=-.75;vel.y=Math.max(vel.y,2.5)}if(ball.position.y<.28)award(ball.position.z>0?1:0);if(ball.position.z<-.5&&ball.position.y<4.8&&Math.random()<dt*.8){vel.z=Math.abs(vel.z)*.92;vel.y=4.4;vel.x+=(Math.random()-.5)*1.6}}
else{if(ball.position.y<1.04&&Math.abs(ball.position.z)<1.65&&Math.abs(ball.position.x)<2.25){vel.y=Math.abs(vel.y)*.82;vel.z*=-.9;ball.position.y=1.06}if(ball.position.y<.14||Math.abs(ball.position.z)>5.8)award(ball.position.z>0?1:0);if(ball.position.z<-.3&&Math.random()<dt*1.4){vel.z=Math.abs(vel.z)*.9;vel.y=2.3;vel.x+=(Math.random()-.5)*1.4}}
ball.rotation.x+=dt*4;ball.rotation.z+=dt*3}
if(pointLock>0)pointLock-=dt;let p=people.find(o=>o.userData.user);if(p&&state!=='menu'){camera.position.lerp(v(p.position.x,sport==='volleyball'?10:7.5,p.position.z+(sport==='volleyball'?12:9)),.04);camera.lookAt(p.position.x,0,p.position.z)}renderer.render(scene,camera)}
$('back').onclick=()=>{location.href='index.html'};$('serve').onclick=serveBall;$('hit').onclick=hit;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';toast(paused?'PAUSED':'再開')};document.querySelectorAll('[data-move]').forEach(b=>{let d=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();touch.add(d);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>touch.delete(d)))});addEventListener('keydown',e=>{keys.add(e.key);if(e.code==='Space'){e.preventDefault();if(state==='ready')serveBall();else hit()}if(e.key==='Escape'&&state!=='menu'){$('pause').click()}});addEventListener('keyup',e=>keys.delete(e.key));init();
})();
</script></body></html>
